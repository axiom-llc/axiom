services:
  apex:
    build: .
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      APEX_API_KEY: ${APEX_API_KEY:?Set APEX_API_KEY before starting the container}
    ports:
      - "8080:8080"
    volumes:
      - apex_data:/root/.apex

volumes:
  apex_data:
